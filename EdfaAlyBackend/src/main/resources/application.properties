spring.application.name=edfaaly-backend

# قاعدة البيانات - SQLite (ملف واحد محلي، مفيش سيرفر منفصل مطلوب)
# الملف هيتعمل تلقائيًا في جذر المشروع أول ما تشغّل التطبيق
spring.datasource.url=jdbc:sqlite:edfaaly_db.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

server.port=8080

# Swagger / OpenAPI UI - افتح المتصفح على الرابط ده عشان تجرب كل الـ APIs
springdoc.swagger-ui.path=/swagger-ui.html

# بيانات تجريبية (سائق + راكب) بتتعمل تلقائيًا أول تشغيل عشان تجرب الـ APIs على طول
# اعمله false في بيئة الإنتاج
app.demo.seed-data=true

# مفتاح توقيع الـ JWT - لازم يتغير في بيئة الإنتاج ويتخزن كمتغير بيئة (Environment Variable) مش هنا
app.jwt.secret=CHANGE_THIS_SECRET_KEY_IN_PRODUCTION_ENV_VARIABLE_1234567890
app.jwt.expiration-ms=86400000
